<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Conversations — lucidité</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1b2119;
    --ink-soft: #242c22;
    --paper: #f1e7d2;
    --paper-soft: #e6d9bd;
    --gold: #c29a4b;
    --oxblood: #7b3131;
    --text-on-paper: #2a241c;
    --muted-on-paper: rgba(42,36,28,0.55);
    --max: 760px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text-on-paper);
    font-family:"Space Mono", monospace;
    min-height:100vh;
  }

  header.site-header{
    max-width:var(--max); margin:0 auto;
    padding:2.5rem 1.5rem 1.5rem;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid rgba(42,36,28,0.16);
  }
  .wordmark{
    font-family:"Fraunces", serif; font-weight:480;
    font-size:1.15rem; margin:0; letter-spacing:-0.01em;
    color:inherit; text-decoration:none;
  }
  nav.site-nav a{
    color:var(--text-on-paper); text-decoration:none;
    font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase;
    margin-left:1.25rem; border-bottom:1px solid rgba(42,36,28,0.35);
  }
  nav.site-nav a:hover{ border-bottom-color:var(--oxblood); }

  main{max-width:var(--max); margin:0 auto; padding:3rem 1.5rem 6rem;}

  .eyebrow{
    font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold); margin:0 0 0.6rem;
  }
  h1.title{
    font-family:"Fraunces", serif; font-weight:340; font-optical-sizing:auto;
    font-size:clamp(2rem, 6vw, 2.6rem); line-height:1.08; margin:0 0 0.5rem;
    color:var(--ink);
  }
  .intro{
    color:var(--muted-on-paper); font-size:0.85rem; line-height:1.7;
    max-width:52ch; margin:0 0 3rem;
  }

  .entry-list{ list-style:none; margin:0; padding:0; }
  .entry{
    display:block; padding:1.5rem 0; border-top:1px solid rgba(42,36,28,0.14);
    text-decoration:none; color:inherit;
  }
  .entry:last-child{ border-bottom:1px solid rgba(42,36,28,0.14); }
  .entry-name{
    font-family:"Fraunces", serif; font-weight:500; font-size:1.3rem;
    color:var(--ink); margin:0 0 0.35rem;
  }
  .entry.is-live:hover .entry-name{ color:var(--oxblood); }
  .entry-blurb{ font-size:0.78rem; color:var(--muted-on-paper); line-height:1.6; }
  .entry.is-draft{ opacity:0.5; cursor:default; }
  .entry-tag{
    display:inline-block; font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--gold); margin-bottom:0.4rem;
  }

  footer{
    max-width:var(--max); margin:0 auto; padding:2rem 1.5rem 4rem;
    color:var(--muted-on-paper); font-size:0.7rem; letter-spacing:0.04em;
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="https://blog.varunagarwal.com">lucidité</a>
  <nav class="site-nav">
    <a href="https://blog.varunagarwal.com">HOME</a>
    <a href="../">NOTES</a>
    <a href="https://contact.varunagarwal.com">CONTACT</a>
  </nav>
</header>

<main>
  <p class="eyebrow">Notes / Conversations</p>
  <h1 class="title">Conversations</h1>
  <p class="intro">Things I keep turning over out loud — questions I don't have a tidy answer to yet, written down mid-thought.</p>

  <ul class="entry-list" id="entries"></ul>
</main>

<footer>Conversations, added as they happen</footer>

<script>
  const TOPICS = [
    {name:"Whose idea is it anyway?", slug:'whose-idea-is-it-anyway', status:'live', blurb:'An ethical declaration — trying to work out how much AI involvement is okay, and where authorship actually sits.'},
  ];

  const list = document.getElementById('entries');
  list.innerHTML = TOPICS.map(t => {
    const isLive = t.status === 'live';
    const inner = `
      ${!isLive ? '<span class="entry-tag">Coming soon</span><br>' : ''}
      <p class="entry-name">${t.name}</p>
      <p class="entry-blurb">${t.blurb}</p>`;
    return isLive
      ? `<a class="entry is-live" href="${t.slug}/">${inner}</a>`
      : `<div class="entry is-draft">${inner}</div>`;
  }).join('');
</script>

</body>
</html>
