<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Conversations — lucidité</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400;1,9..144,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2a2018;
    --ink-soft: rgba(42,32,24,0.62);
    --paper: #d9c9a3;
    --paper-soft: #efe4c8;
    --gold: #a9803a;
    --oxblood: #8a3226;
    --text-on-paper: #2a2018;
    --muted-on-paper: rgba(42,32,24,0.6);
    --max: 760px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text-on-paper);
    font-family:"Special Elite", monospace;
    min-height:100vh;
  }

  header.site-header{
    max-width:var(--max); margin:0 auto;
    padding:2.5rem 1.5rem 1.5rem;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:0.5rem 0;
    border-bottom:2px solid var(--ink);
  }
  .wordmark{
    font-family:"Fraunces", serif; font-weight:480; font-style:italic;
    font-size:1.15rem; margin:0; letter-spacing:-0.01em;
    color:inherit; text-decoration:none;
  }
  nav.site-nav a{
    color:var(--text-on-paper); text-decoration:none;
    font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase;
    margin-left:1.1rem; border-bottom:1px solid rgba(42,32,24,0.4);
  }
  nav.site-nav a:hover{ border-bottom-color:var(--oxblood); color:var(--oxblood); }

  main{max-width:var(--max); margin:0 auto; padding:3rem 1.5rem 6rem;}

  .eyebrow{
    font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold); margin:0 0 0.6rem;
  }
  h1.title{
    font-family:"Fraunces", serif; font-weight:600; font-style:italic;
    font-size:clamp(2.1rem, 6vw, 2.6rem); line-height:1.05; margin:0 0 0.6rem;
    color:var(--ink);
  }
  .intro{
    color:var(--muted-on-paper); font-size:0.82rem; line-height:1.75;
    max-width:50ch; margin:0 0 3rem;
  }

  .drawer{ display:flex; flex-direction:column; gap:1.4rem; }
  .card{
    position:relative;
    display:block;
    background:var(--paper-soft);
    border:1px solid rgba(42,32,24,0.22);
    box-shadow:3px 4px 0 rgba(42,32,24,0.16);
    padding:1.3rem 1.3rem 1.4rem 2.5rem;
    text-decoration:none; color:inherit;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:nth-child(3n+1){ transform:rotate(-0.4deg); }
  .card:nth-child(3n+2){ transform:rotate(0.3deg); }
  .card.is-live:hover{ transform:translateY(-2px) rotate(0deg); box-shadow:4px 6px 0 rgba(42,32,24,0.22); }
  .card.is-draft{ opacity:0.6; }
  .card::before{
    content:""; position:absolute; top:50%; left:14px; transform:translateY(-50%);
    width:11px; height:11px; border-radius:50%;
    background:var(--paper); border:1.5px solid var(--ink);
  }
  .stamp{
    position:absolute; top:-10px; right:12px;
    font-family:"Special Elite", monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--oxblood); border:1.5px solid var(--oxblood); border-radius:3px;
    padding:2px 8px; background:var(--paper-soft);
    transform:rotate(-5deg); opacity:0.88;
  }
  .entry-name{
    font-family:"Fraunces", serif; font-weight:600; font-size:1.25rem;
    color:var(--ink); margin:0 0 0.4rem;
  }
  .card.is-live:hover .entry-name{ color:var(--oxblood); }
  .entry-blurb{ font-size:0.76rem; color:var(--muted-on-paper); line-height:1.65; }

  footer{
    max-width:var(--max); margin:0 auto; padding:2rem 1.5rem 4rem;
    color:var(--muted-on-paper); font-size:0.7rem; letter-spacing:0.04em;
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="https://blog.varunagarwal.com">lucidité</a>
  <nav class="site-nav">
    <a href="https://blog.varunagarwal.com">HOME</a>
    <a href="../">NOTES</a>
    <a href="https://contact.varunagarwal.com">CONTACT</a>
  </nav>
</header>

<main>
  <p class="eyebrow">Notes / Conversations</p>
  <h1 class="title">Conversations</h1>
  <p class="intro">Things I keep turning over out loud — questions I don't have a tidy answer to yet, written down mid-thought.</p>

  <div class="drawer" id="entries"></div>
</main>

<footer>Conversations, added as they happen</footer>

<script>
  const TOPICS = [
    {name:"Whose idea is it anyway?", slug:'whose-idea-is-it-anyway', status:'live', blurb:'An ethical declaration — trying to work out how much AI involvement is okay, and where authorship actually sits.'},
  ];

  const list = document.getElementById('entries');
  list.innerHTML = TOPICS.map(t => {
    const isLive = t.status === 'live';
    const inner = `
      <span class="stamp">${isLive ? 'Filed' : 'Coming soon'}</span>
      <p class="entry-name">${t.name}</p>
      <p class="entry-blurb">${t.blurb}</p>`;
    return isLive
      ? `<a class="card is-live" href="${t.slug}/">${inner}</a>`
      : `<div class="card is-draft">${inner}</div>`;
  }).join('');
</script>

</body>
</html>
