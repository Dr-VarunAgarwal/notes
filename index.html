<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notes — lucidité</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400;1,9..144,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --drawer: #FFDD9C;
    --card: #FFF3D9;
    --ink: #2b1608;
    --ink-soft: rgba(43,22,8,0.62);
    --gold: #F9B637;
    --stamp: #E73F1E;
    --accent2: #FB6C00;
    --line: rgba(43,22,8,0.2);
    --max: 780px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 10% -10%, rgba(42,32,24,0.06), transparent 45%),
      var(--drawer);
    color:var(--ink);
    font-family:"Special Elite", monospace;
    min-height:100vh;
  }

  header.site-header{
    max-width:var(--max); margin:0 auto;
    padding:2.5rem 1.5rem 1.5rem;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:0.5rem 0;
    border-bottom:2px solid var(--ink);
  }
  .wordmark{
    font-family:"Fraunces", serif; font-weight:480; font-style:italic;
    font-size:1.15rem; margin:0; letter-spacing:-0.01em;
    color:inherit; text-decoration:none;
  }
  nav.site-nav a{
    color:var(--ink); text-decoration:none;
    font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase;
    margin-left:1.1rem; border-bottom:1px solid rgba(42,32,24,0.4);
  }
  nav.site-nav a:hover{ border-bottom-color:var(--stamp); color:var(--stamp); }

  main{max-width:var(--max); margin:0 auto; padding:3rem 1.5rem 6rem;}

  .eyebrow{
    font-size:0.66rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--gold); margin:0 0 0.7rem;
  }
  h1.title{
    font-family:"Fraunces", serif; font-weight:600; font-style:italic;
    font-size:clamp(2.1rem, 6vw, 2.8rem); line-height:1.05; margin:0 0 0.6rem;
    color:var(--ink);
  }
  .intro{
    color:var(--ink-soft); font-size:0.82rem; line-height:1.75;
    max-width:50ch; margin:0 0 3rem;
  }

  .drawer{ display:flex; flex-direction:column; gap:1.4rem; }

  .card{
    position:relative;
    display:flex; gap:1.1rem; align-items:flex-start;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:3px 4px 0 rgba(42,32,24,0.16);
    padding:1.3rem 1.3rem 1.4rem 2.5rem;
    text-decoration:none; color:inherit;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:nth-child(3n+1){ transform:rotate(-0.4deg); }
  .card:nth-child(3n+2){ transform:rotate(0.3deg); }
  .card:nth-child(3n+3){ transform:rotate(-0.15deg); }
  .card.is-live:hover{ transform:translateY(-2px) rotate(0deg); box-shadow:4px 6px 0 rgba(42,32,24,0.22); }
  .card.is-draft{ opacity:0.6; }

  .card::before{
    content:""; position:absolute; top:50%; left:14px; transform:translateY(-50%);
    width:11px; height:11px; border-radius:50%;
    background:var(--drawer); border:1.5px solid var(--ink);
  }

  .stamp{
    position:absolute; top:-10px; right:12px;
    font-family:"Special Elite", monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--stamp); border:1.5px solid var(--stamp); border-radius:3px;
    padding:2px 8px; background:var(--card);
    transform:rotate(-5deg); opacity:0.88;
  }
  .stamp.coming{ color:var(--gold); border-color:var(--gold); }

  .card-cover{
    width:74px; height:74px; flex:none; object-fit:cover;
    border:3px solid #fdf8ea; box-shadow:0 1px 3px rgba(42,32,24,0.3);
    transform:rotate(-2deg);
  }
  .card-body{ min-width:0; }
  .card-name{
    font-family:"Fraunces", serif; font-weight:600; font-size:1.25rem;
    color:var(--ink); margin:0 0 0.4rem;
  }
  .card.is-live:hover .card-name{ color:var(--stamp); }
  .card-blurb{ font-size:0.76rem; color:var(--ink-soft); line-height:1.65; }

  footer{
    max-width:var(--max); margin:0 auto; padding:2rem 1.5rem 4rem;
    color:var(--ink-soft); font-size:0.68rem; letter-spacing:0.04em;
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="https://blog.varunagarwal.com">lucidité</a>
  <nav class="site-nav">
    <a href="https://books.varunagarwal.com">BOOKS</a>
    <a href="https://wander.varunagarwal.com">WANDER</a>
    <a href="https://contact.varunagarwal.com">CONTACT</a>
  </nav>
</header>

<main>
  <h1 class="title">Notes</h1>
  <p class="intro">Writeups that don't fit anywhere else — gadgets, projects, whatever I've been messing with. Filed as I go.</p>

  <div class="drawer" id="entries"></div>
</main>

<footer>Notes, catalogued as they happen</footer>

<script>
  /* To add an entry: copy an object below, set status to 'live' once
     that slug/ folder exists with its own index.html. */
  const ENTRIES = [
    {name:"E-Ink'd", slug:'e-inked', status:'live', cover:'e-inked/img/xteink-01-cafe-mondegar.jpg', blurb:'Five e-ink devices I actually use — XTEink X4, Kindle Colorsoft, Bloomin8 photo frame, TRMNL X, Pebble Time 2.'},
    {name:'Conversations', slug:'conversations', status:'live', blurb:"Things I keep turning over out loud. First up — whose idea is it anyway?"},
  ];

  const list = document.getElementById('entries');
  list.innerHTML = ENTRIES.map(e => {
    const isLive = e.status === 'live';
    const inner = `
      <span class="stamp ${isLive ? '' : 'coming'}">${isLive ? 'Filed' : 'Coming soon'}</span>
      ${e.cover ? `<img class="card-cover" src="${e.cover}" alt="" loading="lazy">` : ''}
      <div class="card-body">
        <p class="card-name">${e.name}</p>
        <p class="card-blurb">${e.blurb}</p>
      </div>`;
    return isLive
      ? `<a class="card is-live" href="${e.slug}/">${inner}</a>`
      : `<div class="card is-draft">${inner}</div>`;
  }).join('');
</script>

</body>
</html>
